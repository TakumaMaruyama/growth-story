name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swim_story_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swim_story_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/swim_story_test
      ALLOW_INTEGRATION_DB_TESTS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Test migration data preservation
        run: npm run test:migrations

      - name: Apply and verify migrations
        run: |
          npm run db:init
          npm run db:verify

      - name: Test database concurrency and session security
        run: npm run test:db

      - name: Lint, typecheck, and test
        run: npm run check

      - name: Build
        run: npm run build
